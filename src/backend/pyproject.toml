[project]
name = "myplaylist-backend"
version = "0.1.0"
description = "Monolito de MyPlaylist (ADR-0001, ADR-0002)"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30",
    "boto3>=1.35",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "pillow>=11",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "segno>=1.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "anyio>=4.6",
    "boto3-stubs[sesv2]>=1.35",
    "httpx2>=2.13",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "zxing-cpp>=2.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
