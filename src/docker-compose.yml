# Entorno local de MyPlaylist (ADR-0013, plan D10).
# El navegador solo ve http://localhost:5173: Vite sirve la SPA y reenvía /api a `api`
# y /socket.io a `realtime` (feature 002, plan D6).
name: myplaylist

# El monolito firma los tickets de tiempo real y `realtime` los valida: tienen que usar
# el mismo secreto (ADR-0014). En local vale el de desarrollo de los dos servicios.
x-realtime-ticket-secret: &realtime-ticket-secret ${REALTIME_TICKET_SECRET:-solo-para-desarrollo-local-no-usar-en-produccion}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-myplaylist}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    # Migra al arrancar: en local la base vive en el volumen de este compose.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment: &backend-env
      ENV: local
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-myplaylist}
      EMAIL_BACKEND: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      PUBLIC_BASE_URL: http://localhost:5173
      DATA_POLICY_VERSION: ${DATA_POLICY_VERSION:-0000-borrador}
      # Eventos de la sesión de música hacia `realtime` (feature 002, plan D6).
      REDIS_URL: redis://redis:6379/0
      REALTIME_TICKET_SECRET: *realtime-ticket-secret
      # Catálogo de música (feature 003, plan D8): el falso por defecto, que entiende el
      # reproductor falso. Con YouTube real: CATALOG_PROVIDER=youtube y YOUTUBE_API_KEY.
      CATALOG_PROVIDER: ${CATALOG_PROVIDER:-fake}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      # Firma de la cookie del dispositivo del cliente (feature 003, plan D3). Solo lo
      # usa el monolito; el valor de desarrollo no sirve en producción.
      DEVICE_TOKEN_SECRET: ${DEVICE_TOKEN_SECRET:-solo-para-desarrollo-local-dispositivo-no-usar-en-produccion}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker:
    build: ./backend
    command: python -m app.worker
    environment: *backend-env
    depends_on:
      # Espera a la API, que es quien aplica las migraciones.
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Latido reciente: el bucle del trabajador sigue vivo.
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/worker-heartbeat') > 30)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  realtime:
    build: ./realtime
    environment:
      ENV: local
      PORT: "3001"
      REDIS_URL: redis://redis:6379/0
      REALTIME_TICKET_SECRET: *realtime-ticket-secret
    depends_on:
      # Sin Redis no arranca: el reenvío se suscribe antes de abrir el puerto.
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    environment:
      API_PROXY_TARGET: http://api:8000
      REALTIME_PROXY_TARGET: http://realtime:3001
      # Proveedor de reproducción del servidor de desarrollo (plan D5): el falso, que
      # entiende las referencias fake:… de `devtools enqueue` y usan las pruebas e2e.
      # Con YouTube real (prueba manual, T019): VITE_PLAYBACK_PROVIDER=youtube. El build
      # de producción siempre usa YouTube.
      VITE_PLAYBACK_PROVIDER: ${VITE_PLAYBACK_PROVIDER:-fake}
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
      realtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:
